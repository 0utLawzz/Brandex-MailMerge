<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/png" href="assets/brandex-favicon-20261003.png">
  <link rel="apple-touch-icon" href="assets/brandex-logo-12.png">
  <meta name="theme-color" content="#C94A00">
  <title>Trademark Application — Brandex CMS</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #F0E8D0; color: #0C0C0C;
           display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .box { border: 3px solid #0C0C0C; background: #FAF6EE; padding: 2rem; box-shadow: 5px 5px 0 #0C0C0C; max-width: 420px; text-align: center; }
  </style>
</head>
<body>
  <div class="box" id="msg">Loading Trademark Application…</div>
  <script>
  (function () {
    // Full form body from last complete commit; we rebrand header/footer after load
    var SRC = "https://raw.githubusercontent.com/0utLawzz/Brandex-MailMerge/95b95a4af0145da3eaf956d885cdb731521cb42a/trademark-application.html";

    var NAV_CSS =
      ".navbar{position:sticky;top:0;z-index:1000;height:60px;background:#0C0C0C;border-bottom:3px solid #C94A00;box-shadow:0 5px 0 rgba(0,0,0,.2);display:flex;align-items:center;justify-content:space-between;padding:0 20px;gap:12px}" +
      ".nb-brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;flex-shrink:0}" +
      ".nb-logo{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid #C94A00;background:#FAF6EE}" +
      ".nb-brand-text{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;color:#FAF6EE;line-height:1.1}" +
      ".nb-brand-sub{font-family:'DM Mono',monospace;font-size:9px;color:#0D9970;letter-spacing:2px;text-transform:uppercase;margin-top:1px}" +
      ".nb-nav{display:flex;align-items:center;gap:0;flex:1;justify-content:center}" +
      ".ni{display:flex;align-items:center;padding:0 16px;height:60px;color:rgba(250,246,238,.55);font-family:'DM Mono',monospace;font-size:11px;font-weight:500;letter-spacing:1px;text-transform:uppercase;text-decoration:none;border-bottom:4px solid transparent}" +
      ".ni:hover{color:#FAF6EE;background:#1A1A1A}" +
      ".ni.active{color:#FAF6EE;border-bottom-color:#C94A00}" +
      ".nb-right{display:flex;align-items:center;gap:8px;flex-shrink:0}" +
      ".nb-pill{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1px;color:#C94A00;border:1.5px solid #333;padding:4px 8px;text-transform:uppercase}" +
      "@media(max-width:720px){.nb-brand-sub{display:none}.nb-brand-text{font-size:18px}.ni{padding:0 10px;font-size:10px}}";

    var NAV_HTML =
      '<nav class="navbar" role="navigation" aria-label="Main">' +
      '<a class="nb-brand" href="index.html">' +
      '<img src="assets/brandex-logo-15.png" alt="Brandex" class="nb-logo" width="40" height="40">' +
      '<div><div class="nb-brand-text">BRANDEX</div>' +
      '<div class="nb-brand-sub">Trademark Application · CMS</div></div></a>' +
      '<div class="nb-nav">' +
      '<a class="ni" href="index.html">Home</a>' +
      '<a class="ni active" href="trademark-application.html">Application</a>' +
      '<a class="ni" href="records.html">Records</a></div>' +
      '<div class="nb-right"><span class="nb-pill">CMS v1.3</span></div></nav>';

    var FOOTER =
      '<footer style="text-align:center;padding:14px 12px;font-family:\'DM Mono\',monospace;font-size:0.58rem;letter-spacing:1px;color:#FFF9F0;background:#0C0C0C;text-transform:uppercase">' +
      'BRANDEX LAW ASSOCIATES · <span style="color:#C94A00">WWW.BRANDEX.PK</span> · INFO@BRANDEX.PK · +92 336 0015009 · ISLAMABAD · KARACHI · LAHORE · MULTAN · RAWALPINDI</footer>';

    function patch(html) {
      // Favicon / theme
      html = html.replace(/<link rel="icon"[^>]*>/g, '');
      if (html.indexOf('brandex-favicon-20261003') === -1) {
        html = html.replace('<title>',
          '<link rel="icon" type="image/png" href="assets/brandex-favicon-20261003.png">' +
          '<link rel="apple-touch-icon" href="assets/brandex-logo-12.png">' +
          '<meta name="theme-color" content="#C94A00"><title>');
      }
      // CSS
      if (html.indexOf('.nb-logo{') === -1) {
        html = html.replace('</style>', NAV_CSS + '</style>');
      }
      // Nav (bx-nav or navbar)
      html = html.replace(/<nav[\s\S]*?<\/nav>/, NAV_HTML);
      // Footer
      html = html.replace(/<footer[\s\S]*?<\/footer>/, FOOTER);
      // Class dropdown: plain numbers
      html = html.replace(/opt\.textContent\s*=\s*c\.n\s*\+\s*[^;]+;/g, 'opt.textContent = String(c.n);');
      html = html.replace(/opt\.textContent\s*=\s*`[^`]+`;/g, 'opt.textContent = String(c.n);');
      return html;
    }

    fetch(SRC)
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      })
      .then(function (html) {
        document.open();
        document.write(patch(html));
        document.close();
      })
      .catch(function (err) {
        document.getElementById('msg').innerHTML =
          '<strong>Could not load form.</strong><br><br>' + err.message +
          '<br><br><a href="index.html">← CMS Home</a>';
      });
  })();
  </script>
</body>
</html>
